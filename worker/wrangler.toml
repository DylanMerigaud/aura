name = "aura-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Fixed window request counters for the per IP rate limit. Replace the placeholder id with the id
# printed by: wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "0000000000000000000000000000rate"

# GEMINI_API_KEY and GRADIUM_API_KEY are Worker secrets, set with wrangler secret put. They are
# never written in this file or anywhere else in the repo.
